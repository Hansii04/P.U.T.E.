<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paris 1909 · Spielleiter</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cutive&display=swap');


:root{
  --paper:#e8d28d;
  --paper2:#dbc176;
  --ink:#2b251d;
  --muted:#78694f;
  --line:rgba(89,70,35,.22);
  --red:rgba(137,56,48,.52);
  --desk:#29231d;
  --green:#435846;
  --wine:#74433f;
  --gold:#8d7436;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--desk);color:var(--ink)}
body{
  font-family: "Cutive", Georgia, serif;
  padding:30px 16px 60px;
  background:
    radial-gradient(circle at 20% 15%,rgba(255,255,255,.045),transparent 22%),
    radial-gradient(circle at 76% 80%,rgba(255,255,255,.025),transparent 28%),
    #29231d;
}
.sheet{
  width:min(900px,100%);
  min-height:1120px;
  margin:auto;
  position:relative;
  padding:72px 78px 100px 118px;
  background-color:var(--paper);
  background-image:
    linear-gradient(to bottom, transparent 0, transparent 36px, var(--line) 37px, transparent 38px),
    radial-gradient(circle at 22% 8%, rgba(255,255,255,.13), transparent 16%),
    radial-gradient(circle at 82% 62%, rgba(83,61,26,.05), transparent 21%);
  background-size:100% 38px,auto,auto;
  border:1px solid rgba(65,50,24,.24);
  box-shadow:0 22px 65px rgba(0,0,0,.34);
}
.sheet::before{
  content:"";
  position:absolute;top:0;bottom:0;left:82px;width:2px;background:var(--red)
}
header{margin-bottom:40px;position:relative;z-index:1}
.kicker{font-size:.78rem;text-transform:uppercase;letter-spacing:.26em;color:var(--muted);margin-bottom:7px}
h1{
  margin:0;
  font-family:"Cutive", Georgia, serif;
  font-size:clamp(2.2rem,6vw,4.3rem);
  font-weight:500;
  letter-spacing:.035em;
  line-height:.95;
}
.date{margin-top:8px;font-size:1.25rem;color:var(--muted);font-family:"Cutive", Georgia, serif;font-style:normal}
.section{position:relative;z-index:1;margin:34px 0 44px}
.section-title{
  margin:0 0 14px;
  font-family:"Cutive", Georgia, serif;
  font-size:1.35rem;
  text-transform:none;
  letter-spacing:.17em;
  color:var(--muted);
}
.quest{
  border:0;
  border-bottom:1px solid rgba(78,61,31,.19);
  padding:13px 2px 12px;
}
.quest summary{
  cursor:pointer;
  list-style:none;
  display:flex;
  align-items:center;
  gap:12px;
  min-height:38px;
  font-family:"Cutive", Georgia, serif;
  font-size:1.55rem;
  font-weight:600;
}
.quest summary::-webkit-details-marker{display:none}
.quest summary::before{
  content:"›";
  width:18px;
  font-size:1.35rem;
  transition:transform .18s ease;
  color:var(--gold);
}
.quest[open] summary::before{transform:rotate(90deg)}
.status{
  margin-left:auto;
  font-size:.68rem;
  text-transform:uppercase;
  letter-spacing:.11em;
  padding:4px 8px 3px;
  border:1px solid currentColor;
  border-radius:999px;
  font-weight:400;
}
.status.active{color:var(--green)}
.status.completed{color:var(--wine)}
.quest-body{padding:7px 30px 10px;color:#40372a;line-height:1.5;font-size:1.28rem;font-family:"Caveat",cursive}
.quest-body.empty{opacity:.48;font-style:italic}
.footer{
  position:absolute;left:118px;right:78px;bottom:38px;
  display:flex;justify-content:space-between;gap:20px;
  color:var(--muted);font-size:.77rem;letter-spacing:.06em
}
@media(max-width:650px){
  body{padding:0}
  .sheet{min-height:100vh;padding:54px 25px 82px 58px;box-shadow:none}
  .sheet::before{left:38px}
  .footer{left:58px;right:25px}
  .quest summary{font-size:1.06rem}
}

.adminbar{
  width:min(900px,100%);margin:0 auto 14px;display:flex;gap:9px;flex-wrap:wrap;align-items:center
}
button,.filebtn{
  border:1px solid rgba(255,255,255,.18);background:#efe4bd;color:#2b251d;
  padding:9px 12px;border-radius:7px;font:600 .86rem Georgia,serif;cursor:pointer
}
button:hover,.filebtn:hover{filter:brightness(1.04)}
button.dark{background:#3a332b;color:#f4e9c9}
button.primary{background:#e1c873}
.note{
  color:#d7cdbb;font-size:.8rem;line-height:1.4;margin-left:auto;max-width:360px
}
.dm-section{
  position:relative;z-index:1;margin:28px 0 42px
}
.dm-title{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-bottom:12px
}
.dm-title h2{
  margin:0;font-size:.9rem;text-transform:uppercase;letter-spacing:.16em;color:var(--muted)
}
.card{
  background:rgba(255,250,226,.28);
  border:1px solid rgba(77,60,30,.18);
  padding:12px 12px 10px;margin:9px 0;border-radius:3px
}
.row{display:grid;grid-template-columns:1fr 150px auto;gap:8px;align-items:center}
input,textarea,select{
  width:100%;border:0;border-bottom:1px solid rgba(74,57,28,.28);
  background:rgba(255,255,255,.12);padding:7px 8px;color:var(--ink);
  font:1rem Georgia,serif;outline:none
}
textarea{margin-top:8px;resize:vertical;min-height:64px;line-height:1.45}
.small{font-size:.72rem;color:var(--muted);margin-top:7px}
.hidden-card{opacity:.8;border-style:dashed}
.preview-tag{
  display:inline-block;font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;
  border:1px solid currentColor;border-radius:999px;padding:3px 7px
}
.preview-tag.hidden{color:#795f54}
.preview-tag.active{color:var(--green)}
.preview-tag.completed{color:var(--wine)}
@media(max-width:700px){
  .adminbar{padding:10px}
  .note{width:100%;max-width:none;margin-left:0}
  .row{grid-template-columns:1fr}
}

/* --- Linienraster / saubere Typografie --- */
:root{
  --rule:38px;
}
.sheet{
  background-size:100% var(--rule), auto, auto;
  padding-top:76px;
}
header{
  margin-bottom:38px;
}
.kicker{
  line-height:38px;
  margin:0;
}
h1{
  line-height:76px;
  min-height:76px;
  margin:0;
  padding:0;
  font-size:clamp(2.1rem,5.2vw,3.7rem);
}
.date{
  line-height:38px;
  min-height:38px;
  margin:0;
  padding:0;
}
.section{
  margin:38px 0 38px;
}
.section-title{
  line-height:38px;
  min-height:38px;
  margin:0;
  padding:0;
}
.quest{
  padding:0;
  margin:0;
  border-bottom:0;
}
.quest summary{
  min-height:38px;
  line-height:38px;
  padding:0 2px;
  gap:10px;
  align-items:center;
  font-size:1.18rem;
}
.quest summary::before{
  line-height:38px;
}
.status{
  line-height:20px;
  padding:3px 7px 2px;
  transform:translateY(-1px);
  white-space:nowrap;
}
.quest-body{
  margin:0;
  padding:0 30px 0;
  line-height:38px;
  min-height:38px;
  font-size:1rem;
}
.quest-body br{
  line-height:38px;
}
.footer{
  line-height:38px;
  bottom:38px;
}
@media(max-width:650px){
  .sheet{
    padding-top:38px;
  }
  h1{
    line-height:76px;
    min-height:76px;
  }
  .quest summary{
    font-size:1rem;
  }
  .status{
    font-size:.58rem;
  }
}

</style>

<style>
/* Admin editor: controls sit in clean blocks rather than on top of ruled text */
.dm-section{margin-top:38px}
.card{
  margin:0 0 38px;
  padding:10px 12px 12px;
  background:rgba(255,250,226,.58);
}
.row{
  min-height:42px;
}
input,textarea,select{
  line-height:1.35;
  min-height:36px;
}
textarea{
  min-height:76px;
}
.small{
  line-height:1.45;
}
</style>

</head>
<body>

<div class="adminbar">
  <button class="primary" id="addBtn">+ Nouveau dossier</button>
  <button id="saveBtn">Enregistrer</button>
  <button id="exportBtn">Télécharger la version joueurs</button>
  <button class="dark" id="resetBtn">Réinitialiser</button>
  <div class="note">Les dossiers non commencés restent entièrement invisibles dans la version joueurs.</div>
</div>

<main class="sheet">
<header>
  <div class="kicker">Maître du jeu · Dossier privé</div>
  <h1>P.U.T.E.</h1>
  <div class="date">Paris, 1909</div>
</header>

<section class="dm-section">
  <div class="dm-title"><h2>Dossiers</h2></div>
  <div id="editor"></div>
</section>

<div class="footer">
  <span>Vue maître du jeu</span>
  <span>Confidentiel</span>
</div>
</main>

<script>
const defaultQuests = [{"title": "La Course-Poursuite", "status": "completed", "details": ""}, {"title": "Les Affaires Non Résolues", "status": "active", "details": ""}, {"title": "Les Liens du Sang", "status": "active", "details": ""}, {"title": "Vers le sommet", "status": "hidden", "details": ""}, {"title": "Dans les Salons du Pouvoir", "status": "hidden", "details": ""}, {"title": "Le milieu parisien", "status": "hidden", "details": ""}, {"title": "La Corruption", "status": "hidden", "details": ""}, {"title": "Boum !", "status": "hidden", "details": ""}, {"title": "It's Showtime", "status": "hidden", "details": ""}, {"title": "La Nez", "status": "hidden", "details": ""}];
let quests = JSON.parse(localStorage.getItem("paris1909_quests") || "null") || structuredClone(defaultQuests);

function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
}
function statusLabel(s){
  return s==="active" ? "En cours" : s==="completed" ? "Terminé" : "À faire";
}
function render(){
  const ed=document.getElementById("editor");
  ed.innerHTML="";
  quests.forEach((q,i)=>{
    const c=document.createElement("div");
    c.className="card "+(q.status==="hidden"?"hidden-card":"");
    c.innerHTML=`
      <div class="row">
        <input data-k="title" data-i="${i}" value="${escapeHtml(q.title)}" aria-label="Titel">
        <select data-k="status" data-i="${i}" aria-label="Status">
          <option value="active" ${q.status==="active"?"selected":""}>En cours</option>
          <option value="completed" ${q.status==="completed"?"selected":""}>Terminé</option>
          <option value="hidden" ${q.status==="hidden"?"selected":""}>À faire</option>
        </select>
        <button data-remove="${i}">Entfernen</button>
      </div>
      <textarea data-k="details" data-i="${i}" placeholder="Notes, indices, résumé …">${escapeHtml(q.details||"")}</textarea>
      <div class="small"><span class="preview-tag ${q.status}">${statusLabel(q.status)}</span>
      ${q.status==="hidden" ? " · Invisible pour les joueurs." : " · Visible pour les joueurs."}</div>`;
    ed.appendChild(c);
  });
  bind();
}
function bind(){
  document.querySelectorAll("[data-k]").forEach(el=>{
    el.addEventListener("input",()=>{
      const i=+el.dataset.i, k=el.dataset.k;
      quests[i][k]=el.value;
      if(k==="status") render();
    });
  });
  document.querySelectorAll("[data-remove]").forEach(b=>{
    b.onclick=()=>{ quests.splice(+b.dataset.remove,1); render(); };
  });
}
document.getElementById("addBtn").onclick=()=>{
  quests.push({title:"Nouveau dossier",status:"hidden",details:""});
  render();
};
document.getElementById("saveBtn").onclick=()=>{
  localStorage.setItem("paris1909_quests",JSON.stringify(quests));
  alert("Enregistré.");
};
document.getElementById("resetBtn").onclick=()=>{
  if(confirm("Réinitialiser toutes les modifications locales ?")){
    quests=structuredClone(defaultQuests);
    localStorage.removeItem("paris1909_quests");
    render();
  }
};
document.getElementById("exportBtn").onclick=()=>{
  const visible=quests.filter(q=>q.status!=="hidden");
  const html=makePlayerHtml(visible);
  const blob=new Blob([html],{type:"text/html;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="paris1909_spieler.html";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1200);
};

function makePlayerHtml(visible){
  const active=visible.filter(q=>q.status==="active");
  const completed=visible.filter(q=>q.status==="completed");
  function card(q){
    const body=q.details && q.details.trim()
      ? `<div class="quest-body">${escapeHtml(q.details).replace(/\n/g,"<br>")}</div>`
      : `<div class="quest-body empty">Aucune note supplémentaire.</div>`;
    const label=q.status==="active"?"En cours":"Terminé";
    return `<details class="quest"><summary>${escapeHtml(q.title)}<span class="status ${q.status}">${label}</span></summary>${body}</details>`;
  }
  return `<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paris 1909 · Dossiers</title><style>

}

    radial-gradient(circle at 20% 15%,rgba(255,255,255,.045),transparent 22%),
    radial-gradient(circle at 76% 80%,rgba(255,255,255,.025),transparent 28%),
    #29231d;
}
.sheet{
  width:min(900px,100%);
  min-height:1120px;
  margin:auto;
  position:relative;
  padding:72px 78px 100px 118px;
  background-color:var(--paper);
  background-image:
    linear-gradient(to bottom, transparent 0, transparent 36px, var(--line) 37px, transparent 38px),
    radial-gradient(circle at 22% 8%, rgba(255,255,255,.13), transparent 16%),
    radial-gradient(circle at 82% 62%, rgba(83,61,26,.05), transparent 21%);
  background-size:100% 38px,auto,auto;
  border:1px solid rgba(65,50,24,.24);
  box-shadow:0 22px 65px rgba(0,0,0,.34);
}
.sheet::before{
  content:"";
  position:absolute;top:0;bottom:0;left:82px;width:2px;background:var(--red)
}

h1{
  margin:0;
  font-family:"Cutive", Georgia, serif;
  font-size:clamp(2.2rem,6vw,4.3rem);
  font-weight:500;
  letter-spacing:.035em;
  line-height:.95;
}

  font-family:"Cutive", Georgia, serif;

}

}

  align-items:center;
  gap:12px;
  min-height:38px;

  font-size:1.55rem;
  font-weight:600;
}

  content:"›";
  width:18px;
  font-size:1.35rem;
  transition:transform .18s ease;

}

  text-transform:uppercase;
  letter-spacing:.11em;
  padding:4px 8px 3px;
  border:1px solid currentColor;
  border-radius:999px;
  font-weight:400;
}
.status.active{color:var(--green)}
.status.completed{color:var(--wine)}
.quest-body{padding:7px 30px 10px;color:#40372a;line-height:1.5;font-size:1.28rem;font-family:"Caveat",cursive}
.quest-body.empty{opacity:.48;font-style:italic}
.footer{
  position:absolute;left:118px;right:78px;bottom:38px;
  display:flex;justify-content:space-between;gap:20px;
  color:var(--muted);font-size:.77rem;letter-spacing:.06em
}
@media(max-width:650px){
  body{padding:0}
  .sheet{min-height:100vh;padding:54px 25px 82px 58px;box-shadow:none}
  .sheet::before{left:38px}
  .footer{left:58px;right:25px}
  .quest summary{font-size:1.06rem}
}
_ESC</style></head><body><main class="sheet"><header><div class="kicker">Dossiers privés</div><h1>P.U.T.E.</h1><div class="date">Affaires, pistes et fils en cours</div></header><section class="section"><h2 class="section-title">Dossiers en cours</h2>${active.length?active.map(card).join(""):'<div class="quest-body empty">Aucun dossier en cours.</div>'}</section><section class="section"><h2 class="section-title">Dossiers terminés</h2>${completed.length?completed.map(card).join(""):'<div class="quest-body empty">Aucun dossier terminé.</div>'}</section><div class="footer"><span>Paris · 1909</span><span>Confidentiel</span></div></main></body></html>`;
}
render();
</script>
</body>
</html>
